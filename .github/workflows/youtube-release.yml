name: MediaCube YouTube release
on:
  push:
    branches: [main, 'feat/mediacube-youtube-*']
    paths: ['source/**', 'qa/**', 'releases/**', '.github/workflows/youtube-release.yml']
  pull_request:
    paths: ['source/**', 'qa/**', 'releases/**', '.github/workflows/youtube-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build, package and verify reproducible release bytes
        run: |
          bash source/build-youtube.sh
          node qa/contracts.cjs
          python3 source/youtube/package.py /tmp/mediacube.zip
          if [ -f releases/asmr-barber-fade-master-v3.83-mediacube-youtube.zip ]; then
            cmp releases/asmr-barber-fade-master-v3.83-mediacube-youtube.zip /tmp/mediacube.zip
          fi
          mkdir -p /tmp/youtube-release
          unzip -q /tmp/mediacube.zip -d /tmp/youtube-release
          RELEASE_DIR=/tmp/youtube-release node qa/youtube-contracts.cjs
          sha256sum /tmp/mediacube.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-release-and-contracts
          path: |
            /tmp/mediacube.zip
            qa/results
          retention-days: 14
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, firefox, webkit]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          bash source/build-youtube.sh
          python3 source/youtube/package.py /tmp/mediacube.zip
          mkdir -p /tmp/youtube-release
          unzip -q /tmp/mediacube.zip -d /tmp/youtube-release
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test the extracted upload archive
        env: {BROWSER: '${{ matrix.browser }}', RELEASE_DIR: /tmp/youtube-release, HEADED: '1', LIBGL_ALWAYS_SOFTWARE: '1'}
        run: xvfb-run -a node qa/youtube-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'youtube-${{ matrix.browser }}', path: qa/results, retention-days: 14}
  layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {group: [0, 1, 2, 3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          bash source/build-youtube.sh
          python3 source/youtube/package.py /tmp/mediacube.zip
          mkdir -p /tmp/youtube-release
          unzip -q /tmp/mediacube.zip -d /tmp/youtube-release
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - env: {BROWSER: chromium, LAYOUT: '1', LAYOUT_GROUP: '${{ matrix.group }}', RELEASE_DIR: /tmp/youtube-release, QA_OUTPUT: 'qa/results/youtube-layout-${{ matrix.group }}', HEADED: '1', LIBGL_ALWAYS_SOFTWARE: '1'}
        run: xvfb-run -a node qa/youtube-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'youtube-layout-${{ matrix.group }}', path: qa/results, retention-days: 14}
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          bash source/build-youtube.sh
          python3 source/youtube/package.py /tmp/mediacube.zip
          mkdir -p /tmp/youtube-release
          unzip -q /tmp/mediacube.zip -d /tmp/youtube-release
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - env: {BROWSER: chromium, SOAK: '1', RELEASE_DIR: /tmp/youtube-release, QA_OUTPUT: qa/results/youtube-soak, HEADED: '1', LIBGL_ALWAYS_SOFTWARE: '1'}
        run: xvfb-run -a node qa/youtube-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: youtube-soak, path: qa/results, retention-days: 14}

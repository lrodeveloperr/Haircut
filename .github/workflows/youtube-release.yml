name: MediaCube YouTube release
on:
  push:
    branches: [main, 'feat/mediacube-youtube-*']
    paths: ['source/**', 'qa/**', 'releases/**', '.github/workflows/youtube-release.yml']
  pull_request:
    paths: ['source/**', 'qa/**', 'releases/**', '.github/workflows/youtube-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youtube-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[browser-only]') && 'browsers' || contains(github.event.head_commit.message, '[layout-only]') && 'layouts' || contains(github.event.head_commit.message, '[soak-only]') && 'soak' || contains(github.event.head_commit.message, '[save-only]') && 'saves' || contains(github.event.head_commit.message, '[contracts-only]') && 'contracts' || contains(github.event.head_commit.message, '[graphics-only]') && 'graphics' || contains(github.event.head_commit.message, '[capture-only]') && 'captures' || 'full' }}
  cancel-in-progress: true
jobs:
  contracts:
    if: "!contains(github.event.head_commit.message, '[browser-only]') && !contains(github.event.head_commit.message, '[layout-only]') && !contains(github.event.head_commit.message, '[soak-only]') && !contains(github.event.head_commit.message, '[graphics-only]') && !contains(github.event.head_commit.message, '[capture-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build, package and verify reproducible release bytes
        run: |
          bash source/build-youtube.sh
          node qa/contracts.cjs
          python3 source/youtube/package.py /tmp/mediacube.zip
          python3 - <<'PY'
          from pathlib import Path
          import re
          releases = [(tuple(map(int, m[1].split('.'))), p)
                      for p in Path('releases').glob('*-mediacube-youtube.zip')
                      if (m := re.fullmatch(r'asmr-barber-fade-master-v([0-9]+(?:\.[0-9]+){1,2})-mediacube-youtube\.zip', p.name))]
          latest = max(releases, key=lambda item: item[0])[1]
          assert latest.read_bytes() == Path('/tmp/mediacube.zip').read_bytes(), f'{latest} differs from rebuilt ZIP'
          print(f'Verified reproducible archive: {latest}')
          PY
          mkdir -p /tmp/youtube-release
          unzip -q /tmp/mediacube.zip -d /tmp/youtube-release
          RELEASE_DIR=/tmp/youtube-release node qa/youtube-contracts.cjs
          RELEASE_DIR=/tmp/youtube-release node qa/youtube-quality.cjs
          RELEASE_DIR=/tmp/youtube-release python3 qa/youtube-assets.py
          sha256sum /tmp/mediacube.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-release-and-contracts
          path: |
            /tmp/mediacube.zip
            qa/results
          retention-days: 14
  browsers:
    if: "!contains(github.event.head_commit.message, '[layout-only]') && !contains(github.event.head_commit.message, '[soak-only]') && !contains(github.event.head_commit.message, '[contracts-only]') && !contains(github.event.head_commit.message, '[graphics-only]') && !contains(github.event.head_commit.message, '[capture-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, firefox, webkit]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          bash source/build-youtube.sh
          python3 source/youtube/package.py /tmp/mediacube.zip
          mkdir -p /tmp/youtube-release
          unzip -q /tmp/mediacube.zip -d /tmp/youtube-release
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test the extracted upload archive
        env: {BROWSER: '${{ matrix.browser }}', RELEASE_DIR: /tmp/youtube-release, HEADED: '1', LIBGL_ALWAYS_SOFTWARE: '1'}
        run: xvfb-run -a node qa/youtube-browser.cjs
      - name: Test standalone Sites preview with external SDK blocked
        run: |
          python3 source/youtube/sites-preview.py /tmp/youtube-release /tmp/sites-preview
          BROWSER=${{ matrix.browser }} RELEASE_DIR=/tmp/sites-preview STANDALONE_PREVIEW=1 QA_OUTPUT=qa/results/sites-preview HEADED=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a node qa/youtube-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'youtube-${{ matrix.browser }}', path: qa/results, retention-days: 14}
  graphics:
    if: "!contains(github.event.head_commit.message, '[layout-only]') && !contains(github.event.head_commit.message, '[soak-only]') && !contains(github.event.head_commit.message, '[contracts-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          bash source/build-youtube.sh
          python3 source/youtube/package.py /tmp/mediacube.zip
          mkdir -p /tmp/youtube-release /tmp/youtube-baseline
          unzip -q /tmp/mediacube.zip -d /tmp/youtube-release
          unzip -q releases/asmr-barber-fade-master-v3.94-mediacube-youtube.zip -d /tmp/youtube-baseline
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Compare the same customer at phone and tablet pixel densities
        env: {BROWSER: chromium, QUALITY: '1', BASELINE_DIR: /tmp/youtube-baseline, RELEASE_DIR: /tmp/youtube-release, QA_OUTPUT: qa/results/youtube-graphics, HEADED: '1', LIBGL_ALWAYS_SOFTWARE: '1'}
        run: xvfb-run -a node qa/youtube-browser.cjs
      - name: Require exact rendered customer pixels against v3.94
        env: {BROWSER: chromium, PARITY: '1', BASELINE_DIR: /tmp/youtube-baseline, RELEASE_DIR: /tmp/youtube-release, QA_OUTPUT: qa/results/youtube-parity, HEADED: '1', LIBGL_ALWAYS_SOFTWARE: '1'}
        run: xvfb-run -a node qa/youtube-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: youtube-graphics, path: qa/results, retention-days: 14}
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          python3 -m zipfile -e releases/asmr-barber-fade-master-v3.98-mediacube-youtube.zip qa/release-under-test
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify startup, interrupted compilation and portable shaders
        env: {BROWSER: chromium, STARTUP: '1', RELEASE_DIR: qa/release-under-test, QA_OUTPUT: qa/results/youtube-startup, HEADED: '1', LIBGL_ALWAYS_SOFTWARE: '1'}
        run: |
          RELEASE_DIR=qa/release-under-test python3 qa/youtube-assets.py
          node qa/youtube-geo.cjs
          xvfb-run -a node qa/youtube-browser.cjs
      - name: Verify mobile storage, zero viewport and lossless graphics recovery
        env: {BROWSER: chromium, MOBILE_STARTUP: '1', RELEASE_DIR: qa/release-under-test, QA_OUTPUT: qa/results/youtube-mobile-startup, HEADED: '1', LIBGL_ALWAYS_SOFTWARE: '1'}
        run: xvfb-run -a node qa/youtube-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: youtube-startup, path: qa/results, retention-days: 14}
  windows-shaders:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          python -m zipfile -e releases/asmr-barber-fade-master-v3.98-mediacube-youtube.zip qa/release-under-test
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install chromium
      - name: Verify shaders on the affected ANGLE Direct3D11 backend
        env: {BROWSER: chromium, STARTUP: '1', ANGLE_D3D11: '1', RELEASE_DIR: qa/release-under-test, QA_OUTPUT: qa/results/youtube-d3d11}
        run: node qa/youtube-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: youtube-d3d11, path: qa/results, retention-days: 14}
  layouts:
    if: "!contains(github.event.head_commit.message, '[browser-only]') && !contains(github.event.head_commit.message, '[soak-only]') && !contains(github.event.head_commit.message, '[save-only]') && !contains(github.event.head_commit.message, '[contracts-only]') && !contains(github.event.head_commit.message, '[graphics-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {group: [0, 1, 2, 3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          bash source/build-youtube.sh
          python3 source/youtube/package.py /tmp/mediacube.zip
          mkdir -p /tmp/youtube-release
          unzip -q /tmp/mediacube.zip -d /tmp/youtube-release
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps firefox
      - env: {BROWSER: firefox, LAYOUT: '1', LAYOUT_GROUP: '${{ matrix.group }}', RELEASE_DIR: /tmp/youtube-release, QA_OUTPUT: 'qa/results/youtube-layout-${{ matrix.group }}', HEADED: '1', LIBGL_ALWAYS_SOFTWARE: '1'}
        run: xvfb-run -a node qa/youtube-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'youtube-layout-${{ matrix.group }}', path: qa/results, retention-days: 14}
  soak:
    if: "!contains(github.event.head_commit.message, '[browser-only]') && !contains(github.event.head_commit.message, '[layout-only]') && !contains(github.event.head_commit.message, '[save-only]') && !contains(github.event.head_commit.message, '[contracts-only]') && !contains(github.event.head_commit.message, '[graphics-only]') && !contains(github.event.head_commit.message, '[capture-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          bash source/build-youtube.sh
          python3 source/youtube/package.py /tmp/mediacube.zip
          mkdir -p /tmp/youtube-release
          unzip -q /tmp/mediacube.zip -d /tmp/youtube-release
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps firefox
      - env: {BROWSER: firefox, SOAK: '1', RELEASE_DIR: /tmp/youtube-release, QA_OUTPUT: qa/results/youtube-soak, HEADED: '1', LIBGL_ALWAYS_SOFTWARE: '1'}
        run: xvfb-run -a node qa/youtube-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: youtube-soak, path: qa/results, retention-days: 14}

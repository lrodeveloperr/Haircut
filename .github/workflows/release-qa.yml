name: Haircut v3.47 release audit
on:
  push:
    branches: ['qa/v3.47-release-audit-2026-10-15']
  workflow_dispatch:
permissions:
  contents: read
env:
  ARCHIVE_SHA: 0060b67873b2b4374d71ddf8e59c8c99ea4308c9b53fdc8f2fad30d50b13e815
  RELEASE_DIR: release
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify original archive and extract
        run: |
          echo "$ARCHIVE_SHA  haircut-studio-v3.47-playgama.zip" | sha256sum -c -
          unzip -q haircut-studio-v3.47-playgama.zip -d release
          node --check release/runtime/game.js
      - name: Run bundle contracts
        run: node qa/contracts.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: contracts, path: qa/results, retention-days: 14}
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: {browser: [chromium, firefox, webkit]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify original archive and prepare browser
        run: |
          echo "$ARCHIVE_SHA  haircut-studio-v3.47-playgama.zip" | sha256sum -c -
          unzip -q haircut-studio-v3.47-playgama.zip -d release
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run exact archive browser audit
        env: {BROWSER: '${{ matrix.browser }}'}
        run: node qa/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: '${{ matrix.browser }}', path: qa-results, retention-days: 14}
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare 10-minute Chromium test
        run: |
          echo "$ARCHIVE_SHA  haircut-studio-v3.47-playgama.zip" | sha256sum -c -
          unzip -q haircut-studio-v3.47-playgama.zip -d release
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run sustained gameplay and resource audit
        env: {SOAK: '1', BROWSER: chromium}
        run: node qa/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: soak, path: qa-results, retention-days: 14}

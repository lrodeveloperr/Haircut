name: Android APK

on:
  push:
    branches: ['build/android-current-apk']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build Android runtime and test rewards
        if: ${{ !contains(github.event.head_commit.message, '[native-check]') }}
        run: |
          TARGET=full bash source/buildall.sh
          node android/tests/viewport.cjs
          node android/tests/graphics.cjs
          node android/tests/rewards.cjs
          RELEASE_DIR=source/build-foundation node qa/contracts.cjs
      - name: Install native WebView test client
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Verify Android bridge in Chromium
        env:
          ANDROID_GUARD_ONLY: ${{ contains(github.event.head_commit.message, '[placement-compat]') && '1' || '0' }}
        if: ${{ !contains(github.event.head_commit.message, '[native-check]') }}
        run: |
          npx playwright install --with-deps chromium
          node android/tests/bridge.cjs
      - name: Compile APK and run Android lint
        working-directory: android/native
        run: ./gradlew --no-daemon --stacktrace assembleDebug lintDebug
      - name: Verify and package APK
        run: |
          mkdir -p android-apk
          cp android/native/app/build/outputs/apk/debug/app-debug.apk android-apk/Barber-Simulator-ASMR-Haircut.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android-apk/Barber-Simulator-ASMR-Haircut.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android-apk/Barber-Simulator-ASMR-Haircut.apk > android-apk/apk-details.txt
          git rev-parse HEAD > android-apk/source-commit.txt
          sha256sum android-apk/Barber-Simulator-ASMR-Haircut.apk > android-apk/SHA256SUMS
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play installed APK on phone and tablet windows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node android/tests/apk.cjs
      - name: Collect emulator host diagnostics
        if: always()
        run: |
          mkdir -p qa/results
          ps aux > qa/results/android-installed-host-processes.txt
          sudo dmesg | tail -100 > qa/results/android-installed-host-kernel.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: barber-android-apk
          path: |
            android-apk/
            qa/results/android-installed-*
            qa/results/android-browser-placement-*
            android/native/app/build/reports/lint-results-debug.html
            android/native/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

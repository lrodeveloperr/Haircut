<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barber Simulator: three menu themes (interactive)</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:#14110f; color:#f3ece2; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; }
  /* ---------- the page around the prototype ---------- */
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:center; padding:12px 16px; background:#1d1915; border-bottom:1px solid #2e2822; }
  .bar h1 { font-size:16px; margin:0 8px 0 0; font-weight:800; }
  .seg { display:flex; background:#2a241e; border-radius:12px; padding:3px; gap:2px; }
  .seg button { font:inherit; font-weight:700; color:#cbbfae; background:transparent; border:0; border-radius:9px; padding:7px 14px; cursor:pointer; }
  .seg button.on { background:#f3ece2; color:#1d1915; }
  .stagewrap { flex:1; min-height:0; display:flex; gap:24px; align-items:center; justify-content:center; padding:18px; }
  .info { width:300px; flex:none; font-size:14px; color:#cbbfae; }
  .info h2 { color:#fff; font-size:20px; margin:0 0 4px; }
  .info .tag { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:8px; background:#2a241e; margin:2px 4px 2px 0; }
  .info ul { padding-left:18px; margin:8px 0; }
  .info .hint { font-size:12px; color:#8f8475; }
  @media (max-width:980px){ .stagewrap{flex-direction:column} .info{width:auto;max-width:560px} }
  /* the device: a screen of real proportions, scaled to fit the window */
  .holder { position:relative; flex:none; }
  .device { position:absolute; left:0; top:0; transform-origin:0 0; border-radius:34px; border:10px solid #050403; overflow:hidden; box-shadow:0 20px 60px #000a; background:#000; }
  .device.pc { border-radius:14px; border-width:12px; }
  .screen { position:relative; width:100%; height:calc(100% - var(--banner)); overflow:hidden; container-type:size; }
  .banner { height:var(--banner); background:#e9e9e9; color:#888; font-size:11px; display:flex; align-items:center; justify-content:center; }

  /* ================== shared structure (every theme) ================== */
  .scr { position:absolute; inset:0; display:none; }
  .scr.on { display:block; }
  .scr.enter { animation:enter .42s cubic-bezier(.2,1.3,.4,1); }
  .scr.back-enter { animation:backenter .42s cubic-bezier(.2,1.3,.4,1); }
  @keyframes enter { from { transform:translateX(18%) scale(.96); opacity:0; } }
  @keyframes backenter { from { transform:translateX(-18%) scale(.96); opacity:0; } }
  .bg { position:absolute; inset:0; overflow:hidden; }
  .lay { position:absolute; inset:0; display:grid; gap:2.2cqmin; padding:2.6cqmin; grid-template-rows:auto minmax(0,1fr) minmax(0,1.3fr); max-width:620px; margin:0 auto; }
  .top { display:flex; align-items:center; gap:1.6cqmin; min-width:0; }
  .grow { flex:1; }
  .blocks { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-auto-rows:minmax(0,1fr); gap:2.2cqmin; min-height:0; }
  .lbl { display:block; max-width:100%; white-space:nowrap; overflow:visible; text-align:center; font-weight:900; line-height:1.15; }
  .btn { position:relative; cursor:pointer; user-select:none; -webkit-user-select:none; border:0; font:inherit; color:inherit; padding:0; touch-action:manipulation; }
  .btn:focus-visible { outline:4px solid #4fc3ff; outline-offset:3px; }
  .blk { container-type:size; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2cqmin; }
  .blk .ic { font-size:clamp(26px,44cqmin,110px); line-height:1; }
  .blk .lbl { font-size:clamp(13px,15cqmin,34px); }
  .hero { container-type:size; display:flex; align-items:center; overflow:hidden; }
  .hero .hin { position:absolute; inset:0; display:flex; align-items:center; }
  .hero .face { height:100%; width:min(52%,100cqh); background:center bottom/contain no-repeat; flex:none; animation:bob 3s ease-in-out infinite; }
  /* a tall play card (PC and tablet layouts): the customer above, Play under him */
  @container (max-aspect-ratio: 6/5) { .hero .hin { flex-direction:column; } .hero .face { width:100%; height:auto; flex:1; min-height:0; } .hero .go { flex:none; flex-direction:row; padding:2cqh 0 5cqh; gap:3cqw; } .hero .tri { width:clamp(40px,14cqw,110px); } .hero .go .lbl { font-size:clamp(26px,13cqw,80px); } }
  @keyframes bob { 50% { transform:translateY(-2.5%) rotate(-1deg); } }
  .hero .go { flex:1; display:flex; flex-direction:column; align-items:center; gap:2cqh; }
  .hero .go .lbl { font-size:clamp(26px,20cqh,90px); }
  .hero .tri { width:clamp(40px,30cqh,150px); aspect-ratio:1; overflow:visible; }
  .dot { position:absolute; right:-.6em; top:-.6em; width:1.35em; height:1.35em; border-radius:50%; background:#ff3b30; box-shadow:0 0 0 .2em #fff; font-size:14px; animation:dotp 1.4s ease-in-out infinite; }
  @keyframes dotp { 50% { transform:scale(1.18); } }
  .timer { position:absolute; left:6%; top:6%; font-size:clamp(11px,11cqmin,22px); font-weight:900; padding:.15em .55em; border-radius:1em; font-variant-numeric:tabular-nums; }
  .chip { display:flex; align-items:center; gap:.35em; height:clamp(36px,7.4cqmin,58px); padding:0 .9em 0 .4em; border-radius:999px; font-weight:900; font-size:clamp(14px,3.6cqmin,24px); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .chip .ic { font-size:1.3em; }
  .xpwrap { display:flex; align-items:center; gap:.5em; }
  .medal { width:clamp(44px,9cqmin,66px); aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:clamp(15px,3.8cqmin,26px); }
  .xp { width:clamp(50px,16cqmin,140px); height:clamp(10px,2cqmin,16px); border-radius:99px; overflow:hidden; }
  .xp i { display:block; height:100%; width:78%; border-radius:99px; }
  .gear { width:clamp(44px,8.6cqmin,64px); aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:clamp(22px,4.6cqmin,34px); }
  /* modes screen */
  .mlay { position:absolute; inset:0; display:grid; grid-template-rows:auto minmax(0,1fr); gap:2.2cqmin; padding:2.6cqmin; max-width:900px; margin:0 auto; }
  .mhead { display:flex; align-items:center; gap:2cqmin; }
  .back { width:clamp(46px,9cqmin,64px); aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:clamp(22px,4.6cqmin,32px); font-weight:900; }
  .mtitle { display:flex; align-items:center; gap:.4em; font-size:clamp(20px,5.4cqmin,38px); font-weight:900; padding:.2em .7em; }
  .mgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:minmax(0,1fr); gap:2.2cqmin; min-height:0; }
  .mode { container-type:size; display:grid; grid-template-rows:1fr auto auto; justify-items:center; align-items:center; padding:5cqmin 4cqmin; overflow:hidden; }
  .mode .ic { font-size:clamp(28px,40cqmin,110px); line-height:1; animation:float 3.2s ease-in-out infinite; filter:drop-shadow(0 6px 6px #0004); }
  .mode:nth-child(2n) .ic { animation-delay:-1.1s; } .mode:nth-child(3n) .ic { animation-delay:-2.2s; }
  @keyframes float { 50% { transform:translateY(-7%) rotate(3deg); } }
  .mode .lbl { font-size:clamp(14px,14cqmin,32px); width:100%; }
  .mode .reward { display:flex; gap:.3em; align-items:center; font-weight:900; font-size:clamp(11px,9cqmin,20px); padding:.15em .6em; border-radius:99px; margin-top:2cqmin; }
  .mode .new { position:absolute; top:7cqmin; left:-12cqmin; transform:rotate(-38deg); width:50cqmin; text-align:center; font-weight:900; font-size:clamp(9px,7cqmin,15px); padding:.15em 0; }
  .mode .lock { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3cqmin; font-weight:900; font-size:clamp(14px,11cqmin,28px); }
  .mode .lock .pbar { width:60%; height:clamp(8px,5cqmin,14px); border-radius:99px; overflow:hidden; }
  .mode .lock .pbar i { display:block; height:100%; width:55%; border-radius:99px; }
  /* in-game */
  .game { position:absolute; inset:0; background:url(game-clean.jpg) center/cover; }
  .gb { position:absolute; display:flex; align-items:center; justify-content:center; font-weight:900; }
  .gb.round { border-radius:50%; }
  /* gift */
  .gift { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#0008; z-index:10; }
  .gift.on { display:flex; }
  .gcard { display:flex; flex-direction:column; align-items:center; gap:3cqmin; padding:4cqmin 6cqmin; animation:pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform:scale(.4); opacity:0; } }
  .gcard .box { font-size:clamp(70px,24cqmin,170px); animation:wob 1s ease-in-out infinite; }
  @keyframes wob { 25% { transform:rotate(-7deg) scale(1.04); } 75% { transform:rotate(7deg) scale(1.04); } }
  .gcard .amt { font-size:clamp(28px,8cqmin,56px); font-weight:900; }
  .gcard .row { display:flex; gap:3cqmin; }
  .gcard .row .btn { min-width:clamp(90px,24cqmin,170px); height:clamp(54px,11cqmin,84px); font-size:clamp(20px,5.5cqmin,36px); font-weight:900; display:flex; align-items:center; justify-content:center; gap:.3em; }
  .confetti { position:absolute; width:10px; height:16px; border-radius:2px; z-index:11; pointer-events:none; animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards; }
  @keyframes fall { from { transform:translate(0,0) rotate(0); opacity:1; } to { transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0; } }
  /* ripple and press, shared */
  .rip { position:absolute; inset:0; border-radius:inherit; overflow:hidden; pointer-events:none; }
  .rip i { position:absolute; border-radius:50%; transform:scale(0); background:radial-gradient(circle,#fff9 0,#fff4 45%,#fff0 70%); animation:rip .6s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes rip { to { transform:scale(1); opacity:0; } }
  .btn { transition:transform .32s cubic-bezier(.3,1.8,.5,1), box-shadow .2s, filter .2s; }
  .btn.down { transition:transform .06s, box-shadow .06s; }
  @media (hover:hover) { .btn:hover { filter:brightness(1.06) saturate(1.05); } }
  .enter-stagger > * { animation:popin .5s cubic-bezier(.2,1.5,.4,1) both; }
  .enter-stagger > *:nth-child(1){animation-delay:.02s} .enter-stagger > *:nth-child(2){animation-delay:.06s} .enter-stagger > *:nth-child(3){animation-delay:.1s} .enter-stagger > *:nth-child(4){animation-delay:.14s} .enter-stagger > *:nth-child(5){animation-delay:.18s} .enter-stagger > *:nth-child(6){animation-delay:.22s} .enter-stagger > *:nth-child(7){animation-delay:.26s} .enter-stagger > *:nth-child(8){animation-delay:.3s}
  @keyframes popin { from { transform:scale(.6) translateY(12%); opacity:0; } }
  /* wide screens (tablets on their side, PC): play on the left, blocks on the right */
  @container (min-aspect-ratio: 5/4) {
    .lay { max-width:none; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); grid-template-rows:auto minmax(0,1fr); padding:2.6cqmin 4cqmin; }
    .lay .top { grid-column:1/3; }
    .mgrid { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .mlay { max-width:none; padding:2.6cqmin 4cqmin; }
  }

  /* ================== THEME 1: JELLY GOLD ================== */
  .t1 { font-family:"Arial Rounded MT Bold","Nunito","Baloo 2",system-ui,sans-serif; color:#16233a; }
  .t1 .bg { background:radial-gradient(120% 90% at 50% 0%,#38d1e8,#1679c9 55%,#0d3f86); }
  .t1 .bg::before { content:""; position:absolute; inset:-50%; background:repeating-linear-gradient(-35deg,#ffffff10 0 22px,#0000 22px 60px); animation:pole 14s linear infinite; }
  @keyframes pole { to { transform:translate(60px,0); } }
  .t1 .bg::after { content:""; position:absolute; inset:0; background:radial-gradient(60% 40% at 50% 110%,#ffd76a66,#0000); }
  .t1 .j { border:3px solid #10223f; border-radius:clamp(16px,4cqmin,30px); box-shadow:inset 0 -.5em 0 #0003, inset 0 .25em 0 #fff6, 0 .45em 0 #10223f, 0 .8em 1em #0005; font-size:14px; }
  .t1 .j::before { content:""; position:absolute; left:10%; right:10%; top:6%; height:28%; border-radius:999px; background:linear-gradient(#fffc,#fff0); pointer-events:none; }
  .t1 .j.down { transform:translateY(.32em) scale(1.03,.95); box-shadow:inset 0 -.3em 0 #0003, inset 0 .2em 0 #fff6, 0 .12em 0 #10223f, 0 .3em .5em #0005; }
  .t1 .c-green { background:linear-gradient(#9cf06c,#36b83a); } .t1 .c-yellow { background:linear-gradient(#ffe682,#ffb21a); } .t1 .c-pink { background:linear-gradient(#ffb8d4,#ff5c98); } .t1 .c-blue { background:linear-gradient(#a8e4ff,#3aa2f2); } .t1 .c-orange { background:linear-gradient(#ffc98a,#ff7d2e); } .t1 .c-mint { background:linear-gradient(#b6f5d8,#2fc68f); } .t1 .c-white { background:linear-gradient(#fff,#dfe8f2); } .t1 .c-purple { background:linear-gradient(#e4b8ff,#9c4ef0); } .t1 .c-red { background:linear-gradient(#ffa59b,#f04436); }
  .t1 .hero { border-color:#7a4a00; box-shadow:inset 0 -.5em 0 #0003, inset 0 .25em 0 #fff6, 0 0 0 4px #ffd34d, 0 .5em 0 4px #7a4a00, 0 1em 1.4em #0006; }
  .t1 .hero::after { content:""; position:absolute; top:0; bottom:0; width:30%; left:-40%; background:linear-gradient(100deg,#fff0,#fff8,#fff0); transform:skewX(-20deg); animation:shine 3.2s ease-in-out infinite; }
  @keyframes shine { 0%,55% { left:-40%; } 85%,100% { left:130%; } }
  .t1 .hero .lbl { color:#fff; text-shadow:0 .08em 0 #10223f, 0 0 .3em #0004; -webkit-text-stroke:2px #10223f; paint-order:stroke fill; }
  .t1 .chip { background:#10223fcc; color:#fff; border:2px solid #ffffff30; }
  .t1 .medal { background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc21a 60%,#c27d00); border:3px solid #10223f; color:#10223f; }
  .t1 .xp { background:#ffffff35; } .t1 .xp i { background:linear-gradient(#b5ff7a,#46c43a); }
  .t1 .gear { background:#10223fcc; color:#fff; border:2px solid #ffffff30; }
  .t1 .timer { background:#10223f; color:#fff; }
  .t1 .blk .lbl { color:#10223f; }
  .t1 .mtitle { color:#fff; text-shadow:0 3px 0 #10223f; -webkit-text-stroke:2px #10223f; paint-order:stroke fill; }
  .t1 .mode .reward { background:#10223f; color:#ffe682; }
  .t1 .mode .new { background:#ff3b30; color:#fff; }
  .t1 .mode .lock { background:#10223fb5; color:#fff; } .t1 .mode .lock .pbar { background:#ffffff40; } .t1 .mode .lock .pbar i { background:#ffd34d; }
  .t1 .mode.on { box-shadow:inset 0 -.5em 0 #0003, inset 0 .25em 0 #fff6, 0 0 0 4px #ffd34d, 0 .45em 0 4px #10223f; }
  .t1 .gcard { background:linear-gradient(#fff,#dff3ff); border:4px solid #10223f; border-radius:30px; box-shadow:0 10px 0 #10223f; color:#10223f; }
  .t1 .gb { border:3px solid #10223f; box-shadow:inset 0 -.4em 0 #0003, inset 0 .2em 0 #fff6, 0 .35em 0 #10223f; font-size:14px; color:#10223f; }

  /* ================== THEME 2: NEON NIGHT ================== */
  .t2 { font-family:"Avenir Next Condensed","Bahnschrift","Roboto Condensed",system-ui,sans-serif; color:#fff; }
  .t2 .bg { background:radial-gradient(90% 70% at 50% 20%,#3a1d5c,#170c2b 60%,#09050f); }
  .t2 .bg::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,#ffffff06 0 2px,#0000 2px 26px), repeating-linear-gradient(90deg,#ffffff05 0 2px,#0000 2px 52px); }
  .t2 .bg::after { content:""; position:absolute; left:-20%; right:-20%; bottom:-30%; height:60%; background:radial-gradient(closest-side,#ff2fb080,#0000); filter:blur(30px); animation:haze 6s ease-in-out infinite alternate; }
  @keyframes haze { to { transform:translateX(12%); background:radial-gradient(closest-side,#25e4ff80,#0000); } }
  .t2 .j { --n:#25e4ff; border-radius:clamp(14px,3.6cqmin,26px); background:linear-gradient(160deg,#ffffff1c,#ffffff05 40%,#00000040); border:2px solid var(--n); box-shadow:0 0 .6em var(--n), inset 0 0 .9em color-mix(in srgb,var(--n) 45%,transparent), 0 .5em 1.2em #000a; font-size:14px; backdrop-filter:blur(6px); }
  .t2 .j .lbl { color:#fff; text-shadow:0 0 .35em var(--n), 0 0 .9em var(--n); letter-spacing:.04em; text-transform:uppercase; }
  .t2 .j .ic { filter:drop-shadow(0 0 .25em var(--n)); }
  .t2 .j.down { transform:scale(.95); box-shadow:0 0 1.4em var(--n), inset 0 0 1.6em var(--n), 0 .2em .6em #000a; }
  .t2 .c-green { --n:#39ff88; } .t2 .c-yellow { --n:#ffd23f; } .t2 .c-pink { --n:#ff3fb4; } .t2 .c-blue { --n:#25e4ff; } .t2 .c-orange { --n:#ff8a3d; } .t2 .c-mint { --n:#7dffcf; } .t2 .c-white { --n:#e8e8ff; } .t2 .c-purple { --n:#b46bff; } .t2 .c-red { --n:#ff4a5a; }
  .t2 .hero { --n:#39ff88; border-width:3px; animation:flick 6s infinite; }
  @keyframes flick { 0%,92%,96%,100% { box-shadow:0 0 .8em var(--n), inset 0 0 1.2em #39ff8866, 0 .5em 1.2em #000a; } 94% { box-shadow:0 0 .2em var(--n), inset 0 0 .3em #39ff8822, 0 .5em 1.2em #000a; } }
  .t2 .hero .tri path { fill:#39ff88; filter:drop-shadow(0 0 6px #39ff88); }
  .t2 .chip { background:#ffffff10; border:1.5px solid #ffffff40; color:#fff; }
  .t2 .medal { background:#120a20; border:2px solid #ffd23f; color:#ffd23f; box-shadow:0 0 .6em #ffd23f; }
  .t2 .xp { background:#ffffff1a; } .t2 .xp i { background:linear-gradient(90deg,#ff3fb4,#25e4ff); box-shadow:0 0 8px #25e4ff; }
  .t2 .gear { background:#ffffff10; border:1.5px solid #ffffff40; }
  .t2 .timer { background:#ff3fb4; color:#fff; box-shadow:0 0 .6em #ff3fb4; }
  .t2 .mtitle { color:#fff; text-shadow:0 0 .3em #ffd23f, 0 0 .9em #ffd23f; text-transform:uppercase; letter-spacing:.08em; }
  .t2 .mode .reward { background:#ffffff14; border:1px solid #ffffff40; color:#ffd23f; }
  .t2 .mode .new { background:#ff3fb4; color:#fff; box-shadow:0 0 .8em #ff3fb4; }
  .t2 .mode .lock { background:#09050fcc; color:#fff; } .t2 .mode .lock .pbar { background:#ffffff20; } .t2 .mode .lock .pbar i { background:linear-gradient(90deg,#ff3fb4,#25e4ff); }
  .t2 .mode.on { border-width:3px; box-shadow:0 0 1.4em var(--n), inset 0 0 1.4em color-mix(in srgb,var(--n) 60%,transparent); }
  .t2 .gcard { background:#140b24ee; border:2px solid #ffd23f; border-radius:26px; box-shadow:0 0 1.4em #ffd23f; }
  .t2 .gb { background:#120a20cc; border:2px solid var(--n,#25e4ff); box-shadow:0 0 .6em var(--n,#25e4ff); color:#fff; font-size:14px; }

  /* ================== THEME 3: SOFT GLASS ================== */
  .t3 { font-family:"SF Pro Rounded","Nunito","Quicksand",system-ui,sans-serif; color:#3a2d4d; }
  .t3 .bg { background:#fbe9ef; }
  .t3 .bg i { position:absolute; width:70cqmax; aspect-ratio:1; border-radius:50%; filter:blur(50px); opacity:.85; animation:drift 16s ease-in-out infinite alternate; }
  .t3 .bg i:nth-child(1) { background:#ffc3a8; left:-20cqmax; top:-20cqmax; }
  .t3 .bg i:nth-child(2) { background:#c9b8ff; right:-25cqmax; top:20cqmax; animation-duration:19s; }
  .t3 .bg i:nth-child(3) { background:#a8f0d8; left:5cqmax; bottom:-30cqmax; animation-duration:22s; }
  @keyframes drift { to { transform:translate(12cqmax,8cqmax) scale(1.15); } }
  .t3 .j { border-radius:clamp(20px,5cqmin,36px); background:linear-gradient(150deg,#ffffffb8,#ffffff66); border:1.5px solid #ffffffd0; box-shadow:0 1.2em 2em -0.8em #6a4b8a55, 0 .2em .5em #6a4b8a22, inset 0 1px 0 #fff; backdrop-filter:blur(14px) saturate(1.4); -webkit-backdrop-filter:blur(14px) saturate(1.4); font-size:14px; }
  .t3 .j.down { transform:scale(.94); border-radius:clamp(26px,7cqmin,44px); box-shadow:0 .4em 1em -0.4em #6a4b8a55, inset 0 1px 0 #fff; }
  .t3 .j .ic { filter:drop-shadow(0 .5em .6em #6a4b8a40); }
  .t3 .c-green { background:linear-gradient(150deg,#8ef0b0e0,#3ec98ad0); } .t3 .c-yellow { background:linear-gradient(150deg,#fff3c8d0,#ffe08ab0); } .t3 .c-pink { background:linear-gradient(150deg,#ffd9e6d0,#ffb3cbb0); } .t3 .c-blue { background:linear-gradient(150deg,#d8ecffd0,#b3d5ffb0); } .t3 .c-orange { background:linear-gradient(150deg,#ffe2cdd0,#ffc7a3b0); } .t3 .c-mint { background:linear-gradient(150deg,#d6fff0d0,#a8efd6b0); } .t3 .c-white { background:linear-gradient(150deg,#ffffffd0,#f4eefcb0); } .t3 .c-purple { background:linear-gradient(150deg,#ece2ffd0,#d2c1ffb0); } .t3 .c-red { background:linear-gradient(150deg,#ffd9d6d0,#ffb3adb0); }
  .t3 .hero { box-shadow:0 1.6em 2.4em -1em #2f9b6a88, inset 0 1px 0 #fff; }
  .t3 .hero::after { content:""; position:absolute; inset:-30%; background:radial-gradient(circle at 30% 30%,#ffffff70,#0000 40%); animation:sheen 6s ease-in-out infinite alternate; pointer-events:none; }
  @keyframes sheen { to { transform:translate(30%,20%); } }
  .t3 .hero .lbl { color:#fff; text-shadow:0 .1em .4em #1d6b4680; }
  .t3 .hero .tri path { fill:#fff; }
  .t3 .chip { background:#ffffff99; border:1.5px solid #fff; box-shadow:0 .4em .8em -0.4em #6a4b8a55; backdrop-filter:blur(10px); }
  .t3 .medal { background:linear-gradient(150deg,#fff,#ffe9b0); border:1.5px solid #fff; box-shadow:0 .4em .8em -0.3em #b0821c80; color:#7a5300; }
  .t3 .xp { background:#ffffff80; } .t3 .xp i { background:linear-gradient(90deg,#ff9fb8,#a98bff); }
  .t3 .gear { background:#ffffff99; border:1.5px solid #fff; backdrop-filter:blur(10px); }
  .t3 .timer { background:#3a2d4d; color:#fff; }
  .t3 .mtitle { color:#3a2d4d; }
  .t3 .mode .reward { background:#ffffffaa; color:#7a5300; }
  .t3 .mode .new { background:linear-gradient(90deg,#ff9fb8,#a98bff); color:#fff; }
  .t3 .mode .lock { background:#ffffff99; backdrop-filter:blur(6px); color:#3a2d4d; } .t3 .mode .lock .pbar { background:#ffffffaa; } .t3 .mode .lock .pbar i { background:linear-gradient(90deg,#ff9fb8,#a98bff); }
  .t3 .mode.on { box-shadow:0 0 0 3px #fff, 0 0 0 6px #a98bff, 0 1.2em 2em -0.8em #6a4b8a77; }
  .t3 .gcard { background:linear-gradient(150deg,#ffffffe8,#ffffffb8); border:1.5px solid #fff; border-radius:34px; box-shadow:0 2em 3em -1em #6a4b8a88; backdrop-filter:blur(16px); }
  .t3 .gb { background:#ffffffb0; border:1.5px solid #fff; box-shadow:0 .5em 1em -0.4em #0006; backdrop-filter:blur(8px); color:#3a2d4d; font-size:14px; }

  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
</style>
</head>
<body>
<div class="bar">
  <h1>Menu themes · interactive</h1>
  <div class="seg" id="themes"><button data-t="1" class="on">1 · Jelly Gold</button><button data-t="2">2 · Neon Night</button><button data-t="3">3 · Soft Glass</button></div>
  <div class="seg" id="devices"><button data-d="phone" class="on">Phone</button><button data-d="tablet">Tablet</button><button data-d="pc">PC</button></div>
  <div class="seg"><button id="snd" class="on">Sound on</button></div>
</div>
<div class="stagewrap">
  <div class="holder" id="holder"><div class="device" id="device"><div class="screen" id="screen"></div><div class="banner">banner (phone and tablet only)</div></div></div>
  <div class="info" id="info"></div>
</div>

<template id="tpl">
  <div class="bg"><i></i><i></i><i></i></div>
  <!-- HOME -->
  <section class="scr on" data-s="home">
    <div class="lay">
      <div class="top">
        <div class="xpwrap chip" style="padding-left:.2em"><div class="medal">11</div><div class="xp"><i></i></div></div>
        <div class="chip"><span class="ic">🔥</span>4</div>
        <div class="grow"></div>
        <div class="chip"><span class="ic">🪙</span>1250</div>
        <button class="btn gear" aria-label="Settings">⚙️</button>
      </div>
      <button class="btn j hero c-green" data-go="game" aria-label="Play"><div class="hin"><div class="face" style="background-image:url(face-next.png)"></div><div class="go"><svg class="tri" viewBox="0 0 24 24"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72L8.5 3.74A1 1 0 0 0 7 4.6z" fill="#fff" stroke="#10223f" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="lbl" data-k="play"></span></div></div></button>
      <div class="blocks enter-stagger">
        <button class="btn j blk c-yellow" data-go="modes"><span class="ic">🎮</span><span class="lbl" data-k="modes"></span></button>
        <button class="btn j blk c-white"><span class="ic">📅</span><span class="lbl" data-k="daily"></span><span class="dot"></span></button>
        <button class="btn j blk c-pink" data-gift="1"><span class="ic">🎁</span><span class="lbl" data-k="gift"></span><span class="dot"></span></button>
        <button class="btn j blk c-blue"><span class="ic">🧥</span><span class="lbl" data-k="wardrobe"></span><span class="dot"></span></button>
        <button class="btn j blk c-orange"><span class="ic">💈</span><span class="lbl" data-k="salon"></span></button>
        <button class="btn j blk c-mint"><span class="ic">📖</span><span class="lbl" data-k="styles"></span></button>
      </div>
    </div>
  </section>
  <!-- MODES -->
  <section class="scr" data-s="modes">
    <div class="mlay">
      <div class="mhead"><button class="btn j back c-white" data-go="home" aria-label="Back">‹</button><div class="mtitle">🎮 <span data-k="modes"></span></div><div class="grow"></div><div class="chip"><span class="ic">🪙</span>1250</div></div>
      <div class="mgrid enter-stagger">
        <button class="btn j mode c-green on" data-go="game"><span class="ic">💬</span><span class="lbl" data-k="orders"></span><span class="reward">⭐⭐⭐</span></button>
        <button class="btn j mode c-yellow" data-go="game"><span class="ic">✨</span><span class="lbl" data-k="freestyle"></span><span class="reward">∞</span></button>
        <button class="btn j mode c-red" data-go="game"><span class="ic">🩹</span><span class="lbl" data-k="rescue"></span><span class="reward">🪙×1.5</span><span class="new" data-k="new"></span></button>
        <button class="btn j mode c-white" data-go="game"><span class="ic">📅</span><span class="lbl" data-k="daily"></span><span class="reward">🪙×2</span><span class="dot"></span></button>
        <button class="btn j mode c-orange" data-go="game"><span class="ic">🧔</span><span class="lbl" data-k="beards"></span><span class="reward">🪙×1.2</span></button>
        <button class="btn j mode c-blue" data-go="game"><span class="ic">♨️</span><span class="lbl" data-k="relax"></span><span class="reward">🧖</span></button>
        <button class="btn j mode c-purple" data-locked="1"><span class="ic">⏱️</span><span class="lbl" data-k="rush"></span><span class="reward">⏱45</span><span class="lock">🔒 4<span class="pbar"><i></i></span></span></button>
        <button class="btn j mode c-pink" data-go="game"><span class="ic">❄️</span><span class="lbl" data-k="event"></span><span class="reward">⏳ 3d</span></button>
      </div>
    </div>
  </section>
  <!-- GAME -->
  <section class="scr" data-s="game">
    <div class="game"></div>
    <button class="btn gb j c-yellow" data-go="home" style="left:3cqmin;top:3cqmin;width:clamp(48px,11cqmin,72px);height:clamp(48px,11cqmin,72px);font-size:clamp(22px,5cqmin,34px)" aria-label="Home">🏠</button>
    <div class="chip" style="position:absolute;left:calc(6cqmin + clamp(48px,11cqmin,72px));top:4cqmin"><span class="ic">🪙</span>1250</div>
    <button class="btn gb j round c-green" style="right:3cqmin;top:3cqmin;width:clamp(50px,12cqmin,76px);height:clamp(50px,12cqmin,76px);font-size:clamp(22px,6cqmin,36px);color:#fff" aria-label="Finish">✔</button>
    <button class="btn gb j c-red" style="left:3cqmin;top:calc(6cqmin + clamp(48px,11cqmin,72px));width:clamp(48px,11cqmin,72px);height:clamp(48px,11cqmin,72px);font-size:clamp(22px,5cqmin,34px)" aria-label="Undo">↩</button>
    <button class="btn gb j round c-white" style="right:23cqmin;bottom:4cqmin;width:9cqmin;height:9cqmin;min-width:40px;min-height:40px;font-size:clamp(14px,3.6cqmin,24px)">0</button>
    <button class="btn gb j round c-yellow" style="right:24cqmin;bottom:15cqmin;width:10.5cqmin;height:10.5cqmin;min-width:46px;min-height:46px;font-size:clamp(16px,4.4cqmin,28px)">1</button>
    <button class="btn gb j round c-white" style="right:20cqmin;bottom:26cqmin;width:9cqmin;height:9cqmin;min-width:40px;min-height:40px;font-size:clamp(14px,3.6cqmin,24px)">2</button>
    <button class="btn gb j round c-white" style="right:11cqmin;bottom:32cqmin;width:9cqmin;height:9cqmin;min-width:40px;min-height:40px;font-size:clamp(14px,3.6cqmin,24px)">3</button>
    <button class="btn gb j round c-white" style="right:2cqmin;bottom:34cqmin;width:9cqmin;height:9cqmin;min-width:40px;min-height:40px;font-size:clamp(14px,3.6cqmin,24px)">4</button>
    <button class="btn gb j round c-blue" style="right:3cqmin;bottom:3cqmin;width:18cqmin;height:18cqmin;min-width:70px;min-height:70px;font-size:clamp(30px,8cqmin,56px)" aria-label="Clipper">🪒</button>
    <button class="btn gb j c-white" style="left:3cqmin;bottom:3cqmin;width:14cqmin;height:14cqmin;min-width:56px;min-height:56px;font-size:clamp(26px,6.5cqmin,44px)" aria-label="Tools">✂️</button>
  </section>
  <!-- GIFT -->
  <div class="gift"><div class="gcard"><div class="box">🎁</div><div class="amt">🪙 +100</div><div class="row"><button class="btn j c-green" data-take="1" style="color:#fff">✔</button><button class="btn j c-yellow" data-take="2">×2 ▶</button></div></div></div>
</template>

<script>
const WORDS = { play:'Play', modes:'Modes', daily:'Daily', gift:'Gift', wardrobe:'Wardrobe', salon:'Salon', styles:'Styles', orders:'Orders', freestyle:'Freestyle', rescue:'Rescue', beards:'Beards', relax:'Relax', rush:'Rush', event:'Event', new:'New' };
const INFO = {
  1: { name:'1 · Jelly Gold', tags:['Royal Match / Monopoly GO feel','Bright, juicy, family-wide'], points:['Glossy jelly buttons with a thick base: they squash when pressed and spring back.','The Play card has a gold rim and a shine sweeping across it; barber-pole stripes drift behind everything.','Confetti and a chime when a gift opens.','Reads instantly at any size; the strongest "tap me" pull of the three.'], pc:'On PC it keeps the bold look; hover brightens buttons, the keyboard focus ring shows, and everything is drawn as vectors so it stays sharp at 4K.' },
  2: { name:'2 · Neon Night', tags:['Brawl Stars / night-club barbershop','Bold, cool, Gen-Z'], points:['Dark glass panels outlined in neon tubes that glow, with the Play sign giving an occasional flicker.','Labels lit like shop signs; a coloured haze slowly drifts across the floor.','Pressing makes a button flare brighter, like flipping on a sign.','Looks premium and stands out on the store; the most "streamer-friendly" look on PC.'], pc:'Neon on dark is excellent on PC monitors and in screenshots; glow scales with the screen.' },
  3: { name:'3 · Soft Glass', tags:['Apple Arcade / cozy premium','Calm, ASMR, elegant'], points:['Frosted-glass cards floating over slowly drifting pastel colour clouds.','Buttons squash into softer, rounder shapes when pressed (liquid feel).','Gentle light moves across the Play card; everything breathes slowly.','Matches the ASMR side of the game and feels high-end.'], pc:'Glass and soft shadows scale cleanly to big screens; it is the easiest to make look premium on PC.' },
};
const DEV = { phone:{ w:390, h:844, banner:60 }, tablet:{ w:820, h:1180, banner:90 }, pc:{ w:1600, h:900, banner:0 } };
let theme = '1', dev = 'phone', sound = true;

// ---- sound: soft ASMR taps, synthesised ----
let ctx = null, noise = null;
function ac() { if (!sound) return null; if (!ctx) { ctx = new AudioContext(); const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; noise = b; } if (ctx.state === 'suspended') ctx.resume(); return ctx; }
function tok(f, len, vol) { const c = ac(); if (!c) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain(), bp = c.createBiquadFilter(); o.frequency.setValueAtTime(f * 1.6, t); o.frequency.exponentialRampToValueAtTime(f, t + .012); bp.type = 'bandpass'; bp.frequency.value = f * 1.2; bp.Q.value = 1.4; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + len); o.connect(bp).connect(g).connect(c.destination); o.start(t); o.stop(t + len + .02); }
function swish(a, b, len, vol) { const c = ac(); if (!c) return; const t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = noise; f.type = 'bandpass'; f.Q.value = .9; f.frequency.setValueAtTime(a, t); f.frequency.exponentialRampToValueAtTime(b, t + len); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + len * .35); g.gain.exponentialRampToValueAtTime(.0001, t + len); s.connect(f).connect(g).connect(c.destination); s.start(t, Math.random() * .5, len + .05); }
function chime(ns, gap, vol) { const c = ac(); if (!c) return; ns.forEach((f, i) => { const t = c.currentTime + i * gap, o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + .6); o.connect(g).connect(c.destination); o.start(t); o.stop(t + .65); }); }
const SND = { down: () => tok(theme === '2' ? 300 : theme === '3' ? 520 : 420, .09, .35), up: () => tok(theme === '3' ? 1200 : 980, .05, .12), go: () => swish(2600, 700, .22, .2), back: () => swish(700, 2200, .2, .18), gift: () => chime([1046.5, 1318.5, 1568, 2093], .07, .18), nope: () => { tok(240, .08, .3); setTimeout(() => tok(200, .09, .26), 90); } };

// ---- build the device ----
function fit(root) { root.querySelectorAll('.lbl, [data-k]').forEach((el) => { el.style.fontSize = ''; let s = parseFloat(getComputedStyle(el).fontSize), n = 60; while (el.scrollWidth > el.clientWidth + .5 && s > 9 && n--) { s -= .5; el.style.fontSize = s + 'px'; } }); }
function build() {
  const scr = document.getElementById('screen');
  scr.className = 'screen t' + theme;
  scr.innerHTML = document.getElementById('tpl').innerHTML;
  scr.querySelectorAll('[data-k]').forEach((el) => { el.textContent = WORDS[el.dataset.k]; });
  const d = DEV[dev], device = document.getElementById('device');
  device.className = 'device' + (dev === 'pc' ? ' pc' : '');
  device.style.width = d.w + 20 + 'px'; device.style.height = d.h + 20 + 'px';
  device.style.setProperty('--banner', d.banner + 'px');
  device.querySelector('.banner').style.display = d.banner ? '' : 'none';
  scale();
  requestAnimationFrame(() => fit(scr));
  const i = INFO[theme];
  document.getElementById('info').innerHTML = `<h2>${i.name}</h2>${i.tags.map((t) => `<span class="tag">${t}</span>`).join('')}<ul>${i.points.map((p) => `<li>${p}</li>`).join('')}</ul><p><b>PC:</b> ${i.pc}</p><p class="hint">Tap anything: Play opens the cutting screen, Modes opens the modes, Gift opens a gift, the house comes back. Sound on for the taps.</p>`;
}
function scale() {
  const d = DEV[dev], holder = document.getElementById('holder'), device = document.getElementById('device');
  const availW = Math.min(innerWidth - (innerWidth > 980 ? 380 : 40), 1400), availH = innerHeight - 110;
  const k = Math.min(1, availW / (d.w + 20), availH / (d.h + 20));
  device.style.transform = `scale(${k})`;
  holder.style.width = (d.w + 20) * k + 'px'; holder.style.height = (d.h + 20) * k + 'px';
}
function show(name, dir) {
  const scr = document.getElementById('screen');
  scr.querySelectorAll('.scr').forEach((s) => { const on = s.dataset.s === name; s.classList.toggle('on', on); s.classList.remove('enter', 'back-enter'); if (on) { void s.offsetWidth; s.classList.add(dir === 'back' ? 'back-enter' : 'enter'); s.querySelectorAll('.enter-stagger').forEach((g) => { g.classList.remove('enter-stagger'); void g.offsetWidth; g.classList.add('enter-stagger'); }); } });
  requestAnimationFrame(() => fit(scr));
}
function confetti(scr) {
  const cols = ['#ffd23f', '#ff3fb4', '#25e4ff', '#39ff88', '#ff8a3d', '#fff'];
  for (let i = 0; i < 60; i++) { const c = document.createElement('i'); c.className = 'confetti'; c.style.left = '50%'; c.style.top = '42%'; c.style.background = cols[i % cols.length]; c.style.setProperty('--dx', (Math.random() * 2 - 1) * 260 + 'px'); c.style.setProperty('--dy', (Math.random() * 1.2 - .2) * 340 + 'px'); c.style.setProperty('--r', Math.random() * 900 + 'deg'); scr.appendChild(c); setTimeout(() => c.remove(), 1700); }
}
// ---- touch: press depth, ripple, sound ----
const screenEl = document.getElementById('screen');
screenEl.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.btn'); if (!b) return;
  b.classList.add('down'); SND.down();
  const r = b.getBoundingClientRect(), k = r.width / b.offsetWidth, size = Math.hypot(b.offsetWidth, b.offsetHeight) * 2;
  const w = document.createElement('span'); w.className = 'rip'; const i = document.createElement('i');
  Object.assign(i.style, { width: size + 'px', height: size + 'px', left: (e.clientX - r.left) / k - size / 2 + 'px', top: (e.clientY - r.top) / k - size / 2 + 'px' });
  w.appendChild(i); b.appendChild(w); setTimeout(() => w.remove(), 650);
});
addEventListener('pointerup', () => { const d = screenEl.querySelector('.btn.down'); if (d) { d.classList.remove('down'); SND.up(); } });
screenEl.addEventListener('click', (e) => {
  const b = e.target.closest('.btn'); if (!b) return;
  if (b.dataset.locked) { SND.nope(); b.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6%)' }, { transform: 'translateX(6%)' }, { transform: 'translateX(0)' }], { duration: 300 }); return; }
  if (b.dataset.gift) { const g = screenEl.querySelector('.gift'); g.classList.add('on'); SND.gift(); confetti(screenEl); return; }
  if (b.dataset.take) { screenEl.querySelector('.gift').classList.remove('on'); SND.gift(); return; }
  if (b.dataset.go) { const back = b.dataset.go === 'home'; (back ? SND.back : SND.go)(); show(b.dataset.go, back ? 'back' : 'fwd'); }
});
document.getElementById('themes').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; theme = b.dataset.t; document.querySelectorAll('#themes button').forEach((x) => x.classList.toggle('on', x === b)); build(); });
document.getElementById('devices').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; dev = b.dataset.d; document.querySelectorAll('#devices button').forEach((x) => x.classList.toggle('on', x === b)); build(); });
document.getElementById('snd').addEventListener('click', (e) => { sound = !sound; e.target.classList.toggle('on', sound); e.target.textContent = sound ? 'Sound on' : 'Sound off'; });
addEventListener('resize', scale);
const q = new URLSearchParams(location.search);
if (q.get('t')) { theme = q.get('t'); document.querySelectorAll('#themes button').forEach((x) => x.classList.toggle('on', x.dataset.t === theme)); }
if (q.get('d')) { dev = q.get('d'); document.querySelectorAll('#devices button').forEach((x) => x.classList.toggle('on', x.dataset.d === dev)); }
build();
if (q.get('s')) show(q.get('s'));
</script>
</body>
</html>
